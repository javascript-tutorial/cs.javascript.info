<!DOCTYPE html>
<script>
let eventSource;

function start() { // když je stisknuto tlačítko „Start“
  if (!window.EventSource) {
    // IE nebo jiný starý prohlížeč
    alert("Tento prohlížeč nepodporuje EventSource.");
    return;
  }

  eventSource = new EventSource('digits');

  eventSource.onopen = function(e) {
    log("Událost: open");
  };

  eventSource.onerror = function(e) {
    log("Událost: error");
    if (this.readyState == EventSource.CONNECTING) {
      log(`Obnova připojení (readyState=${this.readyState})...`);
    } else {
      log("Nastala chyba.");
    }
  };

  eventSource.addEventListener('bye', function(e) {
    log("Událost: bye, data: " + e.data);
  });

  eventSource.onmessage = function(e) {
    log("Událost: message, data: " + e.data);
  };
}

function stop() { // když je stisknuto tlačítko „Stop“
  eventSource.close();
  log("eventSource.close()");
}

function log(zpráva) {
  logElem.innerHTML += zpráva + "<br>";
  document.documentElement.scrollTop = 99999999;
}
</script>

<button onclick="start()">Start</button> Začněte stisknutím „Start“.
<div id="logElem" style="margin: 6px 0"></div>

<button onclick="stop()">Stop</button> Ukončete stisknutím „Stop“.
