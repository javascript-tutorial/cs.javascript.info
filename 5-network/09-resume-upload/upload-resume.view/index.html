<!DOCTYPE HTML>

<script src="uploader.js"></script>

<form name="upload" method="POST" enctype="multipart/form-data" action="/upload">
  <input type="file" name="myfile">
  <input type="submit" name="submit" value="Odeslat (Automaticky se obnoví)">
</form>

<button onclick="uploader.stop()">Konec odesílání</button>


<div id="log">Zobrazení průběhu</div>

<script>
  function log(html) {
    document.getElementById('log').innerHTML = html;
    console.log(html);
  }

  function onProgress(načteno, celkem) {
    log("progress " + načteno + ' / ' + celkem);
  }

  let uploader;

  document.forms.upload.onsubmit = async function(e) {
    e.preventDefault();

    let soubor = this.elements.myfile.files[0];
    if (!soubor) return;

    uploader = new Uploader({soubor, onProgress});

    try {
      let odesláno = await uploader.upload();

      if (odesláno) {
        log('úspěch');
      } else {
        log('přerušeno');
      }

    } catch(err) {
      console.error(err);
      log('chyba');
    }
  };

</script>
