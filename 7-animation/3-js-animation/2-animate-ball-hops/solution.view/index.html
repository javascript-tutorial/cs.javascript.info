<!DOCTYPE HTML>
<html>

<head>
  <script src="https://js.cx/libs/animate.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>


  <div id="hřiště">
    <img src="https://js.cx/clipart/ball.svg" width="40" height="40" id="míč">
  </div>

  <script>
    function vytvořEaseOut(časování) {
      return function(poměrČasu) {
        return 1 - časování(1 - poměrČasu);
      }
    }

    function skákání(poměrČasu) {
      for (let a = 0, b = 1; 1; a += b, b /= 2) {
        if (poměrČasu >= (7 - 4 * a) / 11) {
          return -Math.pow((11 - 6 * a - 11 * poměrČasu) / 4, 2) + Math.pow(b, 2)
        }
      }
    }

    function naDruhou(poměrČasu) {
      return Math.pow(poměrČasu, 2);
    }

    míč.onclick = function() {

      let výška = hřiště.clientHeight - míč.clientHeight;
      let šířka = 100;

      animate({
        duration: 2000,
        timing: vytvořEaseOut(skákání),
        draw: function(postup) {
          míč.style.top = výška * postup + 'px'
        }
      });

      animate({
        duration: 2000,
        timing: vytvořEaseOut(naDruhou),
        draw: function(postup) {
          míč.style.left = šířka * postup + "px"
        }
      });
    }
  </script>


</body>

</html>
