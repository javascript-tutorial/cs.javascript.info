<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    img {
      cursor: pointer;
    }
  </style>
  <style>
    #letadlo {
      width: 40px;
      height: 24px;
      transition: all 3s;
    }

    #letadlo.zvětšování {
      width: 400px;
      height: 240px;
    }
  </style>
</head>

<body>

  <img id="letadlo" src="https://en.js.cx/clipart/flyjet.jpg">

  <script>
    let skončila = false; // po skončení animace se změní na true

    letadlo.onclick = function() {

      letadlo.addEventListener('transitionend', function() {
        if (!skončila) { // kontrola, aby se zpráva zobrazila jen jednou
          skončila = true;
          alert('Hotovo!');
        }
      });

      letadlo.classList.add('zvětšování');
    }
  </script>

</body>

</html>
