<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <img src="https://js.cx/clipart/boat.png" id="loď">

  <script>
    loď.onclick = function() {

      this.onclick = null; // animaci by mělo spustit jen první kliknutí

      let kolikrát = 1;

      function spusť() {
        if (kolikrát % 2) {
          loď.classList.remove('zpět');
          loď.style.marginLeft = 100 * kolikrát + 200 + 'px';
        } else {
          loď.classList.add('zpět');
          loď.style.marginLeft = 100 * kolikrát - 200 + 'px';
        }

      }

      spusť();

      loď.addEventListener('transitionend', function() {
        kolikrát++;
        spusť();
      });
    }
  </script>


</body>

</html>
