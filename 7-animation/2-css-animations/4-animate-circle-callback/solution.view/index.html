<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    .zpráva-kruh {
      font-size: 20px;
      line-height: 200px;
      text-align: center;
    }
    .kruh {
      transition-property: width, height;
      transition-duration: 2s;
      position: fixed;
      transform: translateX(-50%) translateY(-50%);
      background-color: red;
      border-radius: 50%;
    }
  </style>
</head>

<body>

  <button onclick="spusť()">Klikněte na mě</button>

  <script>

  function spusť() {
    zobrazKruh(150, 150, 100, div => {
      div.classList.add('zpráva-kruh');
      div.append("Ahoj, světe!");
    });
  }

  function zobrazKruh(cx, cy, poloměr, callback) {
    let div = document.createElement('div');
    div.style.width = 0;
    div.style.height = 0;
    div.style.left = cx + 'px';
    div.style.top = cy + 'px';
    div.className = 'kruh';
    document.body.append(div);

    setTimeout(() => {
      div.style.width = poloměr * 2 + 'px';
      div.style.height = poloměr * 2 + 'px';

      div.addEventListener('transitionend', function handler() {
        div.removeEventListener('transitionend', handler);
        callback(div);
      });
    }, 0);
  }
  </script>


</body>
</html>
