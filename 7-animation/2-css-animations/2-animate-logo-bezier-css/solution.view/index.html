<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    img {
      display: block;
      cursor: pointer;
    }
  </style>
  <style>
    #letadlo {
      width: 40px;
      height: 24px;
      transition: all 3s cubic-bezier(0.25, 1.5, 0.75, 1.5);
    }

    #letadlo.zvětšování {
      width: 400px;
      height: 240px;
    }
  </style>
</head>

<body>

  <img id="letadlo" src="https://en.js.cx/clipart/flyjet.jpg">

  <script>
    letadlo.onclick = function() {
      letadlo.classList.add('zvětšování');
    };
  </script>

</body>

</html>
