<!doctype html>
<html>

<head>
  <meta charset="UTF-8">

  <style>
    iframe {
      width: 400px;
      height: 100px;
      position: absolute;
      top: 0;
      left: -20px;
      opacity: 0;
      z-index: 1;
    }
  </style>

  <script>
    function útok() {

      window.onbeforeunload = function() {
        window.onbeforeunload = null;
        return "Chcete odejít, aniž se dozvíte všechna ta tajemství (haha)?";
      };

      document.body.insertAdjacentHTML('beforeend', '<iframe src="iframe.html">');
    }
  </script>
</head>

<body>

  <p>Po kliknutí na tlačítko návštěvník dostane „podivnou“ otázku, zda chce odejít.</p>

  <p>Odpoví pravděpodobně „Ne“ a ochrana vnitřního rámu bude prolomena.</p>

  <button onclick="útok()">Přidá „chráněný“ vnitřní rám</button>

</body>
</html>
