<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/idb@3.0.2/build/idb.min.js"></script>

<button onclick="přidejKnihu()">Přidat knihu</button>
<button onclick="smažKnihy()">Smazat knihy</button>

<p>Seznam knih:</p>

<ul id="seznamElem"></ul>

<script>
let db;

init();

async function init() {
  db = await idb.openDb('knihyDb', 1, db => {
    db.createObjectStore('knihy', {keyPath: 'název'});
  });

  vypiš();
}

async function vypiš() {
  let tx = db.transaction('knihy');
  let skladKnih = tx.objectStore('knihy');

  let knihy = await skladKnih.getAll();

  if (knihy.length) {
    seznamElem.innerHTML = knihy.map(kniha => `<li>
        název: ${kniha.název}, cena: ${kniha.cena}
      </li>`).join('');
  } else {
    seznamElem.innerHTML = '<li>Žádné knihy zde zatím nejsou. Přidejte prosím nějaké.</li>'
  }


}

async function smažKnihy() {
  let tx = db.transaction('knihy', 'readwrite');
  await tx.objectStore('knihy').clear();
  await vypiš();
}

async function přidejKnihu() {
  let název = prompt("Název knihy?");
  let cena = +prompt("Cena knihy?");

  let tx = db.transaction('knihy', 'readwrite');

  try {
    await tx.objectStore('knihy').add({název, cena});
    await vypiš();
  } catch(chyba) {
    if (chyba.název == 'ConstraintError') {
      alert("Taková kniha již existuje");
      await přidejKnihu();
    } else {
      throw chyba;
    }
  }
}

window.addEventListener('unhandledrejection', událost => {
  alert("Chyba: " + událost.reason.message);
});

</script>
